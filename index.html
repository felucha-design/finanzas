<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="theme-color" content="#ffffff">
<title>Felucha Finanzas</title>
<link rel="apple-touch-icon" id="touchicon">
<link rel="manifest" id="manifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#111;--surf:#F3F2EF;--mut:#6F6D68;--light:#B4B2AD;--lila:#E9D5F7;--lima:#E6F08F;--menta:#CFEBDD;--rosa:#F7D4E8;--coral:#F2735F;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
html,body{height:100%;background:#fff;color:var(--ink);font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit;border:0;background:none;outline:none;-webkit-appearance:none;appearance:none;border-radius:0}
input::placeholder{color:#A9A7A2}
a{color:var(--ink)}a:hover{color:#000}
.view{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;background:#fff}
.view.on{display:block}
.wrap{max-width:480px;margin:0 auto;padding:calc(var(--top) + 18px) 20px calc(var(--bot) + 120px);display:flex;flex-direction:column;gap:22px;min-height:100%}
.h1{font-size:clamp(34px,10.5vw,42px);line-height:1;letter-spacing:-.035em;font-weight:500}
.h1 span{color:var(--light)}
.lbl{font-size:13px;font-weight:500;color:var(--mut)}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.seg{display:flex;background:var(--surf);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;height:44px;border-radius:999px;font-size:16px;font-weight:500;transition:background .2s,color .2s}
.seg button.on{background:var(--ink);color:#fff}
.monto{border-radius:28px;padding:16px 20px 18px;transition:background .3s;display:flex;flex-direction:column;gap:2px;background:var(--lila)}
.monto .lbl{color:#3D3B37}
.monto .row{display:flex;align-items:baseline;gap:8px}
.monto .cur{font-size:22px;font-weight:500}
.monto input{flex:1;min-width:0;font-size:clamp(44px,14vw,56px);line-height:1.1;letter-spacing:-.04em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:500;white-space:nowrap;transition:background .15s,color .15s,transform .1s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ink)!important;color:#fff}
.link{align-self:flex-start;height:40px;padding:0 2px;font-size:15px;font-weight:500;text-decoration:underline;text-underline-offset:4px}
.field{height:52px;border-radius:18px;background:var(--surf);padding:0 16px;font-size:16px;width:100%;min-width:0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.row2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.datepill{position:relative;display:flex;align-items:center;font-size:15px;font-weight:500;white-space:nowrap;width:auto}
.datepill input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.err{font-size:14px;line-height:1.35;color:#B23A2C}
.errbox{background:#FCE9E5;border-radius:14px;padding:12px 14px}
.hide{display:none!important}
.cta{height:60px;width:100%;border-radius:999px;background:var(--ink);color:#fff;font-size:17px;font-weight:500;display:flex;align-items:center;justify-content:space-between;padding:0 9px 0 24px;transition:transform .1s,opacity .2s}
.cta:active{transform:scale(.98)}
.cta .dot{width:42px;height:42px;border-radius:50%;color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:20px;background:#fff;transition:background .3s;flex:none}
.cta[disabled]{opacity:.6}
.sticky{position:sticky;bottom:calc(var(--bot) + 86px);z-index:2;box-shadow:0 0 0 8px #fff,0 12px 28px rgba(0,0,0,.12)}
.tabs{position:fixed;left:0;right:0;bottom:calc(var(--bot) + 14px);display:none;justify-content:center;z-index:10;pointer-events:none}
.tabs.on{display:flex}
.tabs>div{display:flex;gap:4px;padding:5px;background:var(--ink);border-radius:999px;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.tabs button{height:46px;padding:0 24px;border-radius:999px;color:#fff;font-size:13px;font-weight:600;letter-spacing:.08em;transition:background .2s,color .2s}
.tabs button.on{background:#fff;color:var(--ink)}
.toast{position:fixed;left:16px;right:16px;top:calc(var(--top) + 12px);display:flex;justify-content:center;pointer-events:none;z-index:20;opacity:0;transform:translateY(-14px);transition:opacity .3s,transform .3s}
.toast.on{opacity:1;transform:none}
.toast>div{background:var(--ink);color:#fff;border-radius:999px;padding:6px 6px 6px 12px;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:100%}
.toast.on>div{pointer-events:auto}
.toast .ok{width:26px;height:26px;border-radius:50%;background:var(--lima);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.toast .ok.bad{background:var(--rosa)}
.toast .msg{padding:8px 8px 8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{height:36px;padding:0 14px;border-radius:999px;background:var(--lila);color:var(--ink);font-size:14px;font-weight:600;flex:none}
/* setup */
.deco{position:relative;height:236px;margin:8px 0 4px;flex:none}
.deco div{position:absolute;border-radius:26px;padding:16px 20px;font-size:17px;font-weight:500;height:110px}
.deco .c1{left:34px;right:34px;top:0;background:var(--lila);transform:rotate(-6deg)}
.deco .c2{left:22px;right:22px;top:58px;background:var(--lima);transform:rotate(3deg)}
.deco .c3{left:10px;right:10px;top:112px;height:118px;background:var(--ink);color:#fff;border-radius:28px;transform:rotate(-1.5deg);display:flex;flex-direction:column;justify-content:space-between}
.deco .c3 b{font-size:34px;font-weight:400;letter-spacing:-.03em}
.deco .c3 b span{color:#8D8B86}
/* resumen */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.circ{width:44px;height:44px;border-radius:50%;background:var(--surf);font-size:18px;flex:none;transition:opacity .2s}
.circ[disabled]{opacity:.3}
.mtitle{text-align:center;font-size:26px;letter-spacing:-.03em;font-weight:500}
.mtitle span{color:var(--light)}
.pill{align-self:flex-start;font-size:14px;font-weight:500;border-radius:999px;padding:6px 12px}
.big{font-size:clamp(42px,14vw,54px);line-height:1;letter-spacing:-.045em}
.big small{font-size:24px;letter-spacing:-.02em}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:22px}
.tile b{font-size:14px;font-weight:500}
.tile span{font-size:clamp(18px,5.6vw,22px);letter-spacing:-.03em}
.h2{font-size:22px;font-weight:500;letter-spacing:-.02em}
.stack{display:flex;flex-direction:column}
.card{border-radius:30px;padding:18px 20px 44px;margin-bottom:-26px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -2px 10px rgba(0,0,0,.05)}
.card .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .t b{font-size:21px;letter-spacing:-.02em;font-weight:500}
.card .t span{font-size:15px;font-weight:600}
.bar{height:8px;border-radius:99px;background:rgba(0,0,0,.09);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .6s}
.card .f{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#3D3B37}
.card .f span{white-space:nowrap}
.morebtn{align-self:center;height:44px;padding:0 20px;margin-top:34px;border-radius:999px;background:var(--surf);font-size:15px;font-weight:500}
.nb{border:1.5px dashed #D6D4CF;border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.nb b{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb span{font-size:19px;letter-spacing:-.02em}
.day{display:flex;flex-direction:column;gap:4px}
.day .dh{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--mut);padding-bottom:6px;border-bottom:1px solid #ECEBE7}
.tx{display:flex;align-items:center;gap:12px;padding:8px 0}
.tx .av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;flex:none}
.tx .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tx .tt b{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .tt span{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .am{font-size:16px;font-weight:500;white-space:nowrap}
.empty{background:var(--surf);border-radius:24px;padding:28px 20px;font-size:17px;line-height:1.35;text-align:center;color:#3D3B37}
.skel{border-radius:24px;background:var(--surf);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.foot{display:flex;justify-content:center;padding-top:8px}
.foot button{font-size:13px;color:var(--mut);text-decoration:underline;text-underline-offset:3px;height:40px}
</style>
</head>
<body>

<!-- SETUP -->
<section class="view" id="v-setup">
  <div class="wrap" style="padding-bottom:calc(var(--bot) + 28px)">
    <div class="h1" style="font-size:clamp(36px,11.5vw,44px)">Hola, Felu.<br><span>Conectemos<br>tu Notion.</span></div>
    <div class="deco">
      <div class="c1">Gastos</div>
      <div class="c2">Ingresos</div>
      <div class="c3">Presupuesto<b>ARS <span>···</span></b></div>
    </div>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
      <label class="lbl" for="token">Token de integración</label>
      <input id="token" class="field mono" placeholder="ntn_••••••••••••" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" style="height:56px">
      <p style="font-size:13px;line-height:1.4;color:var(--mut)">Lo sacás de notion.so/my-integrations. Se guarda solo en este iPhone, nadie más lo ve.</p>
      <p id="s-err" class="err errbox hide"></p>
      <button class="cta" id="connect" style="margin-top:6px"><span id="connect-l">Conectar</span><span class="dot" id="connect-d">→</span></button>
    </div>
  </div>
</section>

<!-- CARGAR -->
<section class="view" id="v-cargar">
  <div class="wrap">
    <div class="h1" id="c-title">¿En qué se fue?<br><span>Contame todo.</span></div>
    <div class="seg" id="tipo">
      <button data-t="gasto" class="on">Gasto</button>
      <button data-t="ingreso">Ingreso</button>
    </div>
    <div class="monto" id="monto-box">
      <label class="lbl" for="monto">Monto</label>
      <div class="row"><span class="cur">ARS</span><input id="monto" inputmode="numeric" pattern="[0-9]*" placeholder="0" autocomplete="off"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="hd"><span class="lbl">Categoría</span><span class="lbl" id="chips-hint" style="font-weight:400"></span></div>
      <div class="chips" id="chips"></div>
      <button class="link" id="more"></button>
    </div>
    <div class="row2">
      <input id="desc" class="field" placeholder="Detalle (opcional)" autocomplete="off">
      <label class="field datepill"><span id="fecha-l">Hoy</span><input type="date" id="fecha"></label>
    </div>
    <p id="f-err" class="err hide"></p>
    <button class="cta sticky" id="save"><span id="save-l">Guardar en Notion</span><span class="dot" id="save-d">↑</span></button>
  </div>
</section>

<!-- RESUMEN -->
<section class="view" id="v-resumen">
  <div class="wrap" style="gap:30px">
    <div class="mnav">
      <button class="circ" id="prev" aria-label="Mes anterior">←</button>
      <div class="mtitle" id="mtitle"></div>
      <button class="circ" id="next" aria-label="Mes siguiente">→</button>
    </div>
    <div id="rbody" style="display:flex;flex-direction:column;gap:30px"></div>
    <div class="foot"><button id="logout">Desconectar Notion</button></div>
  </div>
</section>

<nav class="tabs" id="tabs"><div>
  <button data-v="cargar">CARGAR</button>
  <button data-v="resumen">RESUMEN</button>
</div></nav>

<div class="toast" id="toast"><div><span class="ok" id="toast-i">✓</span><span class="msg" id="toast-m"></span><button id="undo" class="hide">Deshacer</button></div></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  API: 'https://api.notion.com/v1',
  NOTION_VERSION: '2022-06-28',
  TX_DB: '354549698eac80a6afb2c74007337d0f',
  BUDGET_DB: '354549698eac80598c77c9a4ecccf150',
  TX: { titulo: 'Nombre', tipo: 'Tipo', monto: 'Monto', categoria: 'Categoría', descripcion: 'Descripción', fecha: 'Fecha' },
  TIPO_GASTO: 'Gasto', TIPO_INGRESO: 'Ingreso',
  BUDGET: { categoria: 'Categoría', presupuesto: 'Presupuesto', mes: null }
};
/* Token "demo" = modo prueba con datos de ejemplo, sin Notion. */

const GASTOS = ['Palpa','Carmen','Supermercado','Verdulería','Panadería','Kiosco / almacén','Restaurantes','Cafeterías','Delivery','Transporte público','Cabify / Uber','Nafta / estacionamiento','Farmacia','Psicóloga','Salud','Ropa','Calzado','Electrónica / tech','Hogar / deco','Libros / estudio','Entretenimiento','Recitales / shows','Suscripciones','Regalos','Cuotas','Imprevistos','Otros'];
const INGRESOS = ['Sueldo','Freelance - Oldano','Freelance - Sur Hotel','Freelance - GAM','Freelance - Nuevo cliente','Otros ingresos'];
const TOP_DEFAULT = ['Supermercado','Cafeterías','Verdulería','Delivery','Cabify / Uber','Panadería','Kiosco / almacén','Transporte público'];
const ALL = [...GASTOS, ...INGRESOS];
const PASTEL = ['#E9D5F7','#E6F08F','#CFEBDD','#F8D6C8','#D0E3F4','#F7D4E8','#F2EAB4','#DADDF8'];
const PASTEL_D = ['#B98BE3','#AEBE2E','#6FBF9C','#E5937A','#7FAEDD','#DF8DBB','#C9B54C','#949CEB'];
const MES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const M3 = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmt = n => Math.round(Math.abs(n)).toLocaleString('es-AR');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const wait = ms => new Promise(r => setTimeout(r, ms));
const ci = c => { let i = ALL.indexOf(c); if (i < 0) { i = 0; for (const ch of String(c)) i += ch.charCodeAt(0); } return i % 8; };
const col = c => PASTEL[ci(c)], colD = c => PASTEL_D[ci(c)];
const LS = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
const today = () => iso(new Date());
const mkey = (y, m) => `${y}-${pad(m + 1)}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

/* Migrar token viejo (nf_token) al nuevo key si existe */
(function migrateToken() {
  try {
    const old = localStorage.getItem('nf_token');
    if (old && !localStorage.getItem('felucha_notion_token')) {
      localStorage.setItem('felucha_notion_token', old);
    }
  } catch (e) {}
})();

const now = new Date();
const S = { token: LS.get('felucha_notion_token'), tipo: 'gasto', cat: null, showAll: false, saving: false, months: {}, budgets: {}, y: now.getFullYear(), m: now.getMonth(), showBud: false, last: null, loading: false, error: null, view: null };

/* ---------------- Notion ---------------- */
async function api(path, opts = {}) {
  const r = await fetch(CONFIG.API + path, {
    method: opts.method || 'GET',
    headers: { 'Authorization': 'Bearer ' + S.token, 'Notion-Version': CONFIG.NOTION_VERSION, 'Content-Type': 'application/json' },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.message || ('HTTP ' + r.status)); e.status = r.status; throw e; }
  return j;
}
async function queryAll(db, body) {
  let out = [], cursor = null;
  do {
    const j = await api(`/databases/${db}/query`, { method: 'POST', body: { ...body, page_size: 100, ...(cursor ? { start_cursor: cursor } : {}) } });
    out = out.concat(j.results); cursor = j.has_more ? j.next_cursor : null;
  } while (cursor);
  return out;
}
function pv(p) {
  if (!p) return null;
  switch (p.type) {
    case 'title': case 'rich_text': return p[p.type].map(t => t.plain_text).join('');
    case 'select': return p.select ? p.select.name : null;
    case 'status': return p.status ? p.status.name : null;
    case 'multi_select': return p.multi_select[0] ? p.multi_select[0].name : null;
    case 'number': return p.number;
    case 'date': return p.date ? p.date.start : null;
    case 'formula': return p.formula[p.formula.type];
    case 'rollup': return p.rollup.type === 'number' ? p.rollup.number : null;
  }
  return null;
}
function parseTx(r) {
  const p = r.properties, P = CONFIG.TX;
  const fecha = String(pv(p[P.fecha]) || '').slice(0, 10);
  if (!fecha) return null;
  const tipo = /^ing/i.test(pv(p[P.tipo]) || '') ? 'ingreso' : 'gasto';
  const cat = pv(p[P.categoria]) || (tipo === 'gasto' ? 'Otros' : 'Otros ingresos');
  let desc = P.descripcion ? (pv(p[P.descripcion]) || '') : '';
  if (!desc && P.titulo && P.titulo !== P.descripcion) { const t = pv(p[P.titulo]) || ''; if (t && t !== cat) desc = t; }
  return { id: r.id, tipo, cat, monto: Math.abs(Number(pv(p[P.monto])) || 0), desc, fecha };
}
const Notion = {
  async verify() {
    if (S.token === 'demo') { await wait(700); return; }
    await api('/users/me');
  },
  async create(tx) {
    if (S.token === 'demo') { await wait(500); return 'demo-' + Date.now(); }
    const P = CONFIG.TX, props = {};
    if (P.titulo) props[P.titulo] = { title: [{ text: { content: tx.desc || tx.cat } }] };
    props[P.tipo] = { select: { name: tx.tipo === 'gasto' ? CONFIG.TIPO_GASTO : CONFIG.TIPO_INGRESO } };
    props[P.monto] = { number: tx.monto };
    props[P.categoria] = { select: { name: tx.cat } };
    if (P.descripcion && P.descripcion !== P.titulo && tx.desc) props[P.descripcion] = { rich_text: [{ text: { content: tx.desc } }] };
    props[P.fecha] = { date: { start: tx.fecha } };
    const j = await api('/pages', { method: 'POST', body: { parent: { database_id: CONFIG.TX_DB }, properties: props } });
    return j.id;
  },
  async archive(id) {
    if (S.token === 'demo') { await wait(300); return; }
    await api('/pages/' + id, { method: 'PATCH', body: { archived: true } });
  },
  async month(y, m) {
    if (S.token === 'demo') { await wait(450); return Demo.month(y, m); }
    const P = CONFIG.TX, start = `${mkey(y, m)}-01`, end = iso(new Date(y, m + 1, 1));
    const rows = await queryAll(CONFIG.TX_DB, { filter: { and: [{ property: P.fecha, date: { on_or_after: start } }, { property: P.fecha, date: { before: end } }] }, sorts: [{ property: P.fecha, direction: 'descending' }] });
    return rows.map(parseTx).filter(Boolean);
  },
  async budgets(y, m) {
    if (S.token === 'demo') return { ...Demo.budgets };
    if (!CONFIG.BUDGET_DB) return {};
    const B = CONFIG.BUDGET, ym = mkey(y, m), out = {};
    (await queryAll(CONFIG.BUDGET_DB, {})).forEach(r => {
      const p = r.properties;
      if (B.mes) { const d = pv(p[B.mes]); if (!d || !String(d).startsWith(ym)) return; }
      const c = pv(p[B.categoria]), v = Number(pv(p[B.presupuesto]));
      if (c && v > 0) out[c] = (out[c] || 0) + v;
    });
    return out;
  }
};

/* ---------------- Demo ---------------- */
const Demo = {
  budgets: { 'Supermercado': 170000, 'Verdulería': 35000, 'Panadería': 15000, 'Cafeterías': 40000, 'Delivery': 30000, 'Cabify / Uber': 22000, 'Psicóloga': 80000, 'Suscripciones': 20000, 'Palpa': 45000, 'Carmen': 30000, 'Transporte público': 12000, 'Restaurantes': 50000, 'Farmacia': 15000, 'Salud': 20000, 'Entretenimiento': 25000 },
  cache: {},
  month(y, m) {
    const k = mkey(y, m);
    if (this.cache[k]) return this.cache[k].slice();
    const t = new Date(), isCur = y === t.getFullYear() && m === t.getMonth();
    if (new Date(y, m, 1) > t) return [];
    const max = isCur ? t.getDate() : new Date(y, m + 1, 0).getDate();
    let a = y * 100 + m;
    const r = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let x = Math.imul(a ^ a >>> 15, 1 | a); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
    const ri = (lo, hi) => Math.round((lo + r() * (hi - lo)) / 500) * 500, pick = arr => arr[Math.floor(r() * arr.length)];
    const out = []; let id = 0;
    const add = (d, tipo, cat, monto, desc = '') => { if (d <= max) out.push({ id: `demo-${k}-${id++}`, tipo, cat, monto, desc, fecha: `${k}-${pad(d)}` }); };
    add(1, 'ingreso', 'Sueldo', 1450000, 'Sueldo del mes'); add(4, 'ingreso', 'Freelance - Oldano', 280000, 'Contenido mensual'); add(9, 'ingreso', 'Freelance - Sur Hotel', 240000, 'Reels y stories'); add(16, 'ingreso', 'Freelance - GAM', 150000, 'Campaña');
    [2, 9, 16, 23, 30].forEach(d => add(d, 'gasto', 'Psicóloga', 16000, 'Sesión'));
    add(3, 'gasto', 'Suscripciones', 4500, 'Música'); add(8, 'gasto', 'Suscripciones', 9800, 'Series'); add(14, 'gasto', 'Suscripciones', 2900, 'Nube');
    for (let d = 1; d <= max; d += 3 + Math.floor(r() * 3)) add(d, 'gasto', 'Supermercado', ri(14000, 46000), pick(['Compra grande', 'Reposición', 'Súper del barrio']));
    for (let d = 2; d <= max; d += 7) add(d, 'gasto', 'Verdulería', ri(5000, 10000), 'Feria');
    for (let d = 1; d <= max; d++) {
      if (r() < .45) add(d, 'gasto', 'Cafeterías', ri(3500, 6800), pick(['Cortado + medialuna', 'Café con Juli', 'Flat white para laburar']));
      if (r() < .12) add(d, 'gasto', 'Delivery', ri(9000, 17000), pick(['Pedido de noche', 'Sushi', 'Pizza del viernes']));
      if (r() < .14) add(d, 'gasto', 'Cabify / Uber', ri(3500, 8500), pick(['Vuelta a casa', 'Al centro']));
      if (r() < .16) add(d, 'gasto', 'Panadería', ri(2000, 5000), 'Facturas');
      if (r() < .07) add(d, 'gasto', 'Kiosco / almacén', ri(1500, 4000), 'Kiosco');
    }
    add(5, 'gasto', 'Palpa', ri(12000, 22000)); add(12, 'gasto', 'Carmen', ri(15000, 26000)); add(7, 'gasto', 'Ropa', 38000, 'Campera'); add(17, 'gasto', 'Regalos', 22000, 'Cumple de Mica');
    this.cache[k] = out; return out.slice();
  }
};

/* ---------------- Vistas ---------------- */
function show(v) {
  S.view = v;
  document.querySelectorAll('.view').forEach(el => el.classList.toggle('on', el.id === 'v-' + v));
  $('#tabs').classList.toggle('on', v !== 'setup');
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'cargar') { renderCargar(); try { $('#monto').focus({ preventScroll: true }); } catch (e) {} }
  if (v === 'resumen') { $('#v-resumen').scrollTop = 0; loadResumen(); }
}
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => show(b.dataset.v)));

/* Toast */
let toastT;
function toast(msg, { undo = false, bad = false, ms = 2400 } = {}) {
  $('#toast-m').textContent = msg;
  $('#toast-i').textContent = bad ? '!' : '✓';
  $('#toast-i').classList.toggle('bad', bad);
  $('#undo').classList.toggle('hide', !undo);
  $('#toast').classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => { $('#toast').classList.remove('on'); if (undo) S.last = null; }, ms);
}

/* ---------------- Setup ---------------- */
let connecting = false;
$('#token').addEventListener('input', () => $('#s-err').classList.add('hide'));
$('#token').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
$('#connect').addEventListener('click', connect);
async function connect() {
  if (connecting) return;
  const t = $('#token').value.trim(), err = $('#s-err');
  if (!t) { err.textContent = 'Pegá el token primero. Sin token no hay magia.'; err.classList.remove('hide'); return; }
  connecting = true; S.token = t;
  $('#connect-l').textContent = 'Hablando con Notion…';
  try {
    await Notion.verify();
    LS.set('felucha_notion_token', t);
    $('#connect-l').textContent = '¡Conectado!'; $('#connect-d').style.background = 'var(--lima)';
    await wait(800);
    $('#token').blur(); show('cargar'); prefetch();
  } catch (e) {
    S.token = null;
    err.textContent = e.status === 401 ? 'Notion no reconoce ese token. ¿Lo copiaste completo?' : 'No pude hablar con Notion. ¿Hay señal? Probá de nuevo.';
    err.classList.remove('hide');
    $('#connect-l').textContent = 'Conectar';
  }
  $('#connect-d').style.background = ''; connecting = false;
}

/* ---------------- Cargar ---------------- */
const montoEl = $('#monto'), fechaEl = $('#fecha');
fechaEl.value = today();
function freq() {
  const f = JSON.parse(LS.get('felucha_freq') || '{}');
  Object.values(S.months).forEach(arr => arr.forEach(t => { f[t.cat] = (f[t.cat] || 0) + 1; }));
  return f;
}
function renderCargar() {
  const g = S.tipo === 'gasto';
  document.querySelectorAll('#tipo button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tipo));
  $('#c-title').innerHTML = g ? '¿En qué se fue?<br><span>Contame todo.</span>' : '¿Qué entró?<br><span>Bien ahí.</span>';
  const bg = g ? 'var(--lila)' : 'var(--lima)';
  $('#monto-box').style.background = bg; $('#save-d').style.background = bg;
  renderChips(); renderFecha();
}
function renderChips() {
  const g = S.tipo === 'gasto', cats = g ? GASTOS : INGRESOS, f = freq();
  const rank = c => { const i = TOP_DEFAULT.indexOf(c); return i < 0 ? 99 : i; };
  const sorted = [...cats].sort((a, b) => (f[b] || 0) - (f[a] || 0) || rank(a) - rank(b) || cats.indexOf(a) - cats.indexOf(b));
  let vis = !g || S.showAll ? sorted : sorted.slice(0, 8);
  if (S.cat && !vis.includes(S.cat)) vis = [S.cat, ...vis];
  $('#chips').innerHTML = vis.map(c => `<button class="chip${c === S.cat ? ' on' : ''}" data-c="${esc(c)}" style="background:${col(c)}">${esc(c)}</button>`).join('');
  $('#chips-hint').textContent = !g ? '' : S.showAll ? `Todas (${cats.length})` : 'Las que más usás';
  const more = $('#more'); more.classList.toggle('hide', !g);
  more.textContent = S.showAll ? 'Mostrar menos' : `Ver las ${cats.length}`;
}
function renderFecha() {
  const v = fechaEl.value || today(), d = parseISO(v);
  const diff = Math.round((parseISO(today()) - d) / 864e5);
  const base = `${d.getDate()} ${M3[d.getMonth()]}`;
  $('#fecha-l').textContent = diff === 0 ? `Hoy · ${base}` : diff === 1 ? `Ayer · ${base}` : `${DIA[d.getDay()].slice(0, 3)} ${base}`;
}
$('#tipo').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.dataset.t === S.tipo) return; S.tipo = b.dataset.t; S.cat = null; S.showAll = false; hideErr(); renderCargar(); });
$('#chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; S.cat = S.cat === b.dataset.c ? null : b.dataset.c; hideErr(); renderChips(); });
$('#more').addEventListener('click', () => { S.showAll = !S.showAll; renderChips(); });
montoEl.addEventListener('input', () => { const d = montoEl.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 10); montoEl.value = d ? fmt(Number(d)) : ''; hideErr(); });
fechaEl.addEventListener('change', () => { if (!fechaEl.value) fechaEl.value = today(); renderFecha(); });
const hideErr = () => $('#f-err').classList.add('hide');
function formErr(m) { const e = $('#f-err'); e.textContent = m; e.classList.remove('hide'); }

$('#save').addEventListener('click', async () => {
  if (S.saving) return;
  const monto = Number(montoEl.value.replace(/\D/g, ''));
  if (!monto) { formErr('Falta el monto. ¿Cuánto fue?'); montoEl.focus(); return; }
  if (!S.cat) { formErr('Elegí una categoría.'); return; }
  const tx = { tipo: S.tipo, cat: S.cat, monto, desc: $('#desc').value.trim(), fecha: fechaEl.value || today() };
  S.saving = true; $('#save').disabled = true; $('#save-l').textContent = 'Guardando en Notion…';
  try {
    tx.id = await Notion.create(tx);
    const k = tx.fecha.slice(0, 7);
    if (S.months[k]) S.months[k].unshift(tx);
    if (S.token === 'demo' && Demo.cache[k]) Demo.cache[k].unshift(tx);
    const f = JSON.parse(LS.get('felucha_freq') || '{}'); f[tx.cat] = (f[tx.cat] || 0) + 1; LS.set('felucha_freq', JSON.stringify(f));
    S.last = tx;
    montoEl.value = ''; $('#desc').value = ''; fechaEl.value = today(); S.cat = null; S.showAll = false;
    renderCargar();
    toast(tx.tipo === 'gasto' ? 'Anotado. Notion ya lo sabe.' : '¡Bien ahí! Ingreso anotado.', { undo: true, ms: 4500 });
  } catch (e) {
    if (e.status === 401) return logout(true);
    toast('No se pudo guardar. ¿Hay señal?', { bad: true, ms: 3200 });
  }
  S.saving = false; $('#save').disabled = false; $('#save-l').textContent = 'Guardar en Notion';
});
$('#undo').addEventListener('click', async () => {
  const tx = S.last; if (!tx) return; S.last = null;
  $('#undo').classList.add('hide'); $('#toast-m').textContent = 'Borrando…';
  try {
    await Notion.archive(tx.id);
    const k = tx.fecha.slice(0, 7);
    if (S.months[k]) S.months[k] = S.months[k].filter(t => t.id !== tx.id);
    if (Demo.cache[k]) Demo.cache[k] = Demo.cache[k].filter(t => t.id !== tx.id);
    toast('Listo, lo borré.', { ms: 1600 });
    if (S.view === 'resumen') renderResumen();
  } catch (e) { toast('No pude borrarlo. Fijate en Notion.', { bad: true, ms: 3200 }); }
});

/* ---------------- Resumen ---------------- */
$('#prev').addEventListener('click', () => { if (S.m === 0) { S.m = 11; S.y--; } else S.m--; loadResumen(); });
$('#next').addEventListener('click', () => { if (!canNext()) return; if (S.m === 11) { S.m = 0; S.y++; } else S.m++; loadResumen(); });
const canNext = () => { const t = new Date(); return S.y < t.getFullYear() || (S.y === t.getFullYear() && S.m < t.getMonth()); };
$('#logout').addEventListener('click', () => { if (confirm('¿Desconectar Notion de este iPhone?')) logout(); });
function logout(expired) {
  LS.del('felucha_notion_token'); S.token = null; S.months = {}; S.budgets = {};
  $('#token').value = '';
  show('setup');
  if (expired) { const e = $('#s-err'); e.textContent = 'Notion dejó de reconocer el token. Volvé a pegarlo.'; e.classList.remove('hide'); }
}
async function fetchMonth(y, m, force) {
  const k = mkey(y, m);
  const bk = CONFIG.BUDGET.mes ? k : 'all';
  const jobs = [];
  if (force || !S.months[k]) jobs.push(Notion.month(y, m).then(r => { S.months[k] = r; }));
  if (!S.budgets[bk]) jobs.push(Notion.budgets(y, m).then(r => { S.budgets[bk] = r; }));
  await Promise.all(jobs);
}
async function loadResumen(force) {
  const k = mkey(S.y, S.m);
  $('#mtitle').innerHTML = `${MES[S.m]} <span>${S.y}</span>`;
  $('#next').disabled = !canNext();
  if (!S.months[k] || force) {
    S.error = null;
    $('#rbody').innerHTML = `<div style="display:flex;flex-direction:column;gap:10px"><span class="lbl">Trayendo tus números…</span><div class="skel" style="height:64px;width:70%"></div></div><div class="tiles"><div class="skel" style="height:96px"></div><div class="skel" style="height:96px"></div></div><div class="skel" style="height:120px;border-radius:30px"></div>`;
    try { await fetchMonth(S.y, S.m, force); }
    catch (e) {
      if (e.status === 401) return logout(true);
      if (k !== mkey(S.y, S.m)) return;
      $('#rbody').innerHTML = `<div class="empty">No pude traer los datos de Notion.<br><button class="link" id="retry" style="align-self:center;margin-top:8px">Probar de nuevo</button></div>`;
      $('#retry').addEventListener('click', () => loadResumen(true));
      return;
    }
    if (k !== mkey(S.y, S.m)) return;
  }
  renderResumen();
}
function dayLabel(f) {
  const d = parseISO(f), diff = Math.round((parseISO(today()) - d) / 864e5);
  if (diff === 0) return 'Hoy';
  if (diff === 1) return 'Ayer';
  return `${DIA[d.getDay()]} ${d.getDate()} ${M3[d.getMonth()]}`;
}
function renderResumen() {
  const k = mkey(S.y, S.m), mt = S.months[k] || [];
  const B = S.budgets[CONFIG.BUDGET.mes ? k : 'all'] || {};
  const ing = mt.filter(t => t.tipo === 'ingreso').reduce((a, t) => a + t.monto, 0);
  const gas = mt.filter(t => t.tipo === 'gasto').reduce((a, t) => a + t.monto, 0);
  const diff = ing - gas;
  const spent = {}; mt.forEach(t => { if (t.tipo === 'gasto') spent[t.cat] = (spent[t.cat] || 0) + t.monto; });
  let h = `
  <div style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span class="pill" style="background:${diff >= 0 ? 'var(--menta)' : 'var(--rosa)'}">${diff >= 0 ? 'Te sobra este mes' : 'Te pasaste este mes'}</span>
      <div class="big"><small>${diff < 0 ? '−' : diff > 0 ? '+' : ''}ARS </small>${fmt(diff)}</div>
    </div>
    <div class="tiles">
      <div class="tile" style="background:var(--lima)"><b>Entró</b><span>ARS ${fmt(ing)}</span></div>
      <div class="tile" style="background:var(--lila)"><b>Salió</b><span>ARS ${fmt(gas)}</span></div>
    </div>
  </div>`;
  if (!mt.length) h += `<div class="empty">Mes tranqui. Nada anotado por acá.</div>`;
  const rows = Object.keys(B).map(c => { const sp = spent[c] || 0, bu = B[c]; return { c, sp, bu, pct: sp / bu * 100 }; }).sort((a, b) => b.pct - a.pct);
  if (rows.length && mt.length) {
    const vis = S.showBud ? rows : rows.slice(0, 5);
    h += `<div class="stack"><div class="hd" style="margin-bottom:14px"><span class="h2">Presupuestos</span><span class="lbl" style="font-weight:400">coral = +80%</span></div>`;
    h += vis.map(r => {
      const hot = r.pct > 80, left = r.bu - r.sp;
      const note = left < 0 ? `Te pasaste ${fmt(left)}` : r.sp === 0 ? 'Intacto' : `Quedan ${fmt(left)}`;
      return `<div class="card" style="background:${col(r.c)}"><div class="t"><b>${esc(r.c)}</b><span style="color:${hot ? '#B23A2C' : 'var(--ink)'}">${Math.round(r.pct)}%</span></div><div class="bar"><i style="width:${Math.min(r.pct, 100)}%;background:${hot ? 'var(--coral)' : colD(r.c)}"></i></div><div class="f"><span>${fmt(r.sp)} / ${fmt(r.bu)}</span><span>${note}</span></div></div>`;
    }).join('');
    h += rows.length > 5 ? `<button class="morebtn" id="budmore">${S.showBud ? 'Mostrar menos' : `Ver todos (${rows.length})`}</button>` : `<div style="height:26px"></div>`;
    h += `</div>`;
  }
  const nb = Object.keys(spent).filter(c => !(c in B)).sort((a, b) => spent[b] - spent[a]);
  if (nb.length) {
    h += `<div style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;flex-direction:column;gap:2px"><span class="h2">Sin presupuesto</span><span class="lbl" style="font-weight:400">Gastos que no tienen tope en Notion</span></div><div class="tiles">`;
    h += nb.map(c => `<div class="nb"><b>${esc(c)}</b><span>ARS ${fmt(spent[c])}</span></div>`).join('');
    h += `</div></div>`;
  }
  if (mt.length) {
    const sorted = [...mt].sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, 25);
    const groups = []; sorted.forEach(t => { const g = groups[groups.length - 1]; if (g && g.f === t.fecha) g.items.push(t); else groups.push({ f: t.fecha, items: [t] }); });
    h += `<div style="display:flex;flex-direction:column;gap:18px"><span class="h2">Movimientos</span>`;
    h += groups.map(g => {
      const tot = g.items.reduce((a, t) => a + (t.tipo === 'gasto' ? -t.monto : t.monto), 0);
      return `<div class="day"><div class="dh"><span>${dayLabel(g.f)}</span><span>${tot < 0 ? '−' : '+'}${fmt(tot)}</span></div>` +
        g.items.map(t => `<div class="tx"><div class="av" style="background:${col(t.cat)}">${esc(t.cat[0])}</div><div class="tt"><b>${esc(t.cat)}</b><span>${esc(t.desc || (t.tipo === 'gasto' ? 'Sin detalle' : 'Ingreso'))}</span></div><span class="am">${t.tipo === 'gasto' ? '−' : '+'}ARS ${fmt(t.monto)}</span></div>`).join('') + `</div>`;
    }).join('');
    h += `</div>`;
  }
  $('#rbody').innerHTML = h;
  const bm = $('#budmore'); if (bm) bm.addEventListener('click', () => { S.showBud = !S.showBud; renderResumen(); });
}

/* ---------------- Arranque ---------------- */
function prefetch() { const t = new Date(); fetchMonth(t.getFullYear(), t.getMonth()).then(() => { if (S.view === 'cargar') renderChips(); }).catch(e => { if (e.status === 401) logout(true); }); }
(function icon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
    x.fillStyle = '#E9D5F7'; x.fillRect(0, 0, 180, 180);
    x.fillStyle = '#E6F08F'; x.beginPath(); x.arc(118, 70, 46, 0, 7); x.fill();
    x.fillStyle = '#111'; x.font = '500 112px "Instrument Sans",sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('F', 78, 104);
    const url = c.toDataURL('image/png'); $('#touchicon').href = url;
    const man = { name: 'Felucha Finanzas', short_name: 'Finanzas', start_url: location.href.split('#')[0], display: 'standalone', background_color: '#ffffff', theme_color: '#ffffff', icons: [{ src: url, sizes: '180x180', type: 'image/png' }] };
    $('#manifest').href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/manifest+json' }));
  } catch (e) {}
})();
if (S.token) { show('cargar'); prefetch(); } else show('setup');
</script>
